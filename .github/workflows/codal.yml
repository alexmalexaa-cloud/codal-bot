name: Codal Report Bot

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'نمادهای درخواستی (با فاصله)'
        required: false
        default: 'فولاد فملی شپنا کچاد فخوز'
      chat_id:
        description: 'شناسه چت مقصد'
        required: false

  schedule:
    - cron: "30 6 * * 0-3,6"

permissions:
  contents: read

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Persian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-vazirmatn fonts-noto-core

      - name: Setup Chrome for Screenshot
        run: |
          sudo ln -sf $(which google-chrome-stable) /usr/bin/chromium || true
          sudo ln -sf $(which google-chrome-stable) /usr/bin/chromium-browser || true

      - name: Run Codal Monthly Script
        env:
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          mkdir -p reports
          SYMBOLS="${INPUT_SYMBOLS:-فولاد فملی شپنا کچاد فخوز}"
          
          # اجرای اسکریپت اصلی جهت دریافت داده و ساخت عکس‌های PNG
          python codal_monthly.py --fast --refresh --png --out reports $SYMBOLS

      - name: Send Reports to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          TARGET_CHAT="${INPUT_CHAT_ID:-$DEFAULT_CHAT_ID}"
          shopt -s nullglob
          for file in reports/*.png; do
            echo "Sending $file to Telegram..."
            curl --fail-with-body --silent --show-error \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto" \
              -F "chat_id=${TARGET_CHAT}" \
              -F "photo=@${file}" \
              -F "caption=📊 گزارش عملکرد ماهانه: $(basename "$file" .png)"
          done
