name: Codal Report Bot

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'نمادهای درخواستی'
        required: false
        default: 'فولاد فملی شپنا کچاد فخوز'
      chat_id:
        description: 'شناسه چت مقصد'
        required: false

  # اجرای خودکار روزهای معاملاتی (شنبه تا چهارشنبه ساعت ۱۰ صبح ایران)
  schedule:
    - cron: "30 6 * * 0-3,6"

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies and Persian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-vazirmatn fonts-noto-core
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyTelegramBotAPI
          if [ -d "bourse_app" ] && [ -f "bourse_app/requirements.txt" ]; then
            pip install -r bourse_app/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Setup Chrome for Screenshots
        run: |
          sudo ln -sf $(which google-chrome-stable) /usr/bin/chromium || true
          sudo ln -sf $(which google-chrome-stable) /usr/bin/chromium-browser || true

      - name: Run Report Script
        env:
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          # رفتن به پوشه فایل‌ها در صورت وجود پوشه bourse_app
          [ -d "bourse_app" ] && cd bourse_app
          mkdir -p reports
          SYMBOLS="${INPUT_SYMBOLS:-فولاد فملی شپنا کچاد فخوز}"
          
          # اجرای اسکریپت ماهانه کدال
          if [ -f "scrape.py" ]; then
            python scrape.py $SYMBOLS || true
          fi
          if [ -f "codal_monthly.py" ]; then
            python codal_monthly.py --fast --refresh --png --out reports $SYMBOLS || true
          fi

      - name: Send Reports to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          TARGET_CHAT="${INPUT_CHAT_ID:-$DEFAULT_CHAT_ID}"
          # جستجو و ارسال عکس‌های تولید شده
          find . -type f -name "*.png" | while read -r file; do
            echo "Sending $file..."
            curl --fail-with-body --silent --show-error \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto" \
              -F "chat_id=${TARGET_CHAT}" \
              -F "photo=@${file}" \
              -F "caption=📊 گزارش کدال: $(basename "$file" .png)"
          done
