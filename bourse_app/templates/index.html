{% extends "base.html" %}
{% block title %}بورس‌یار — خانه{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ asset('home.css') }}">
{% endblock %}
{% block content %}

<div class="home">
  <!-- نوار بالای خانه: نماد، زبانه‌ها، تاریخ -->
  <div class="home-top">

    <!-- انتخاب نماد برای عملکرد ماهانه -->
    <form class="sym-search" id="sym-search" role="search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sym-input" placeholder="نماد دیگر…" aria-label="جستجوی نماد برای عملکرد ماهانه">
    </form>

    <div class="home-tabs" role="tablist" aria-label="بخش‌های خانه">
      <button type="button" role="tab" class="home-tab" data-tab="monthly" aria-selected="true">عملکرد ماهانه</button>
      <button type="button" role="tab" class="home-tab" data-tab="estimate" aria-selected="false">برآورد سود</button>
      <button type="button" role="tab" class="home-tab" data-tab="notes" aria-selected="false">یادداشت</button>
    </div>

    <div class="date-pill">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="today"></span>
    </div>
  </div>

  <section class="home-pane" id="pane-monthly" role="tabpanel"></section>
  <section class="home-pane" id="pane-estimate" role="tabpanel" hidden><div id="eps-model" class="eps"></div></section>
  <section class="home-pane" id="pane-notes" role="tabpanel" hidden></section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('home.js') }}"></script>{% endblock %}
